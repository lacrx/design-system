name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the engines floor: recursive fs.watch on Linux starts there.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Examples must validate and build
        run: |
          node bin/cli.js validate --source examples/minimal
          node bin/cli.js validate --source examples/full
          node bin/cli.js build --source examples/full --output /tmp/ci-tokens
